# KnowFlow 官网 Nginx 参考配置
#
# 用途：把站点的 URL 规范化和历史地址跳转放到服务端，做成真正的 301。
# 构建产物里已经生成了 meta refresh 跳转页作为兜底，但 301 对 SEO 更干净：
# 搜索引擎会直接把旧地址的权重合并到新地址，而不是先抓一个中转页。
#
# 部署方式（宝塔面板）：
#   1. 把本文件内容合并进站点的 server 块，或放到 /www/server/panel/vhost/nginx/ 下 include
#   2. nginx -t 检查语法
#   3. nginx -s reload
#
# 站点根目录：/www/wwwroot/www.knowflowchat.cn

# ---------------------------------------------------------------------------
# 1) 域名与协议规范化：非 www、http 一律 301 到 https://www
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name knowflowchat.cn;

    # 证书路径按面板实际配置填写
    # ssl_certificate     /www/server/panel/vhost/cert/www.knowflowchat.cn/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/www.knowflowchat.cn/privkey.pem;

    return 301 https://www.knowflowchat.cn$request_uri;
}

server {
    listen 80;
    server_name www.knowflowchat.cn;

    return 301 https://www.knowflowchat.cn$request_uri;
}

# ---------------------------------------------------------------------------
# 2) 主站
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name www.knowflowchat.cn;

    root /www/wwwroot/www.knowflowchat.cn;
    index index.html;

    charset utf-8;

    # ssl_certificate     /www/server/panel/vhost/cert/www.knowflowchat.cn/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/www.knowflowchat.cn/privkey.pem;

    # -- 历史地址 301 ------------------------------------------------------
    # 博客此前挂在文档目录下（/docs/博客/...），已迁到独立的 /blog。
    # 这些地址已被 Google 与百度收录，必须保留跳转。
    # 注意：nginx 的 location 匹配的是已解码的路径，中文可以直接写。

    location = /docs/博客 {
        return 301 https://www.knowflowchat.cn/blog;
    }

    location ^~ /docs/博客/ {
        rewrite ^/docs/博客/(.+?)(\.html)?$ /blog/$1 permanent;
    }

    # 早期存在过、现已下线的页面：明确 410，让搜索引擎尽快移除，
    # 而不是留在「已抓取 - 尚未编入索引」里反复重试。
    location = /markdown-page { return 410; }
    location = /logo-export   { return 410; }
    location = /sensors-cwm-product-cluster { return 410; }

    # -- 静态资源缓存 ------------------------------------------------------
    location ~* \.(?:css|js|woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # sitemap / robots / 备案验证文件必须始终可访问（不要被安全规则拦成 403）
    location = /robots.txt          { expires 1h; access_log off; }
    location = /sitemap.xml         { expires 1h; }
    location = /en/sitemap.xml      { expires 1h; }
    location ~ ^/baidu_verify_.*\.html$ { expires 1h; }

    # -- 路由 --------------------------------------------------------------
    # Docusaurus 配置了 trailingSlash: false，产物是 `about.html` 这种形态；
    # deploy.sh 会额外生成 `about/index.html` 兼容目录式访问。
    # 两种都尝试，最后回落到 404 页面。
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # -- 安全响应头 --------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态站点无需接受写请求
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    access_log /www/wwwlogs/www.knowflowchat.cn.log;
    error_log  /www/wwwlogs/www.knowflowchat.cn.error.log;
}
